[package]
name = "matterweave-explorer"
version.workspace = true
edition = "2021"
rust-version = "1.96"
publish = false

[lib]
name = "matterweave_explorer"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "matterweave-explorer"
path = "src/main.rs"

[dependencies]
matterweave-core = { path = "../../crates/matterweave-core" }
matterweave-detail = { path = "../../crates/matterweave-detail" }
matterweave-render = { path = "../../crates/matterweave-render" }
matterweave-physics = { path = "../../crates/matterweave-physics" }
matterweave-pacing = { path = "../../crates/matterweave-pacing" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
winit = { version = "=0.30.12", features = ["android-native-activity"] }
glam = "=0.30.9"
pollster = "=0.4.0"
log = "=0.4.28"

# Thread CPU clock for opt-in capture only; already in the locked graph.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.0", features = ["native-activity"] }
android_logger = "=0.15.1"
