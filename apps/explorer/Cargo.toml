[package]
name = "matterweave-explorer"
version.workspace = true
edition = "2021"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "matterweave_explorer"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "matterweave-explorer"
path = "src/main.rs"

[dependencies]
matterweave-core = { path = "../../crates/matterweave-core" }
matterweave-detail = { path = "../../crates/matterweave-detail" }
matterweave-render = { path = "../../crates/matterweave-render" }
matterweave-physics = { path = "../../crates/matterweave-physics" }
matterweave-pacing = { path = "../../crates/matterweave-pacing" }
matterweave-audio = { path = "../../crates/matterweave-audio", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
winit = { version = "=0.30.12", features = ["android-native-activity"] }
glam = "=0.34.1"
pollster = "=1.0.1"
log = "=0.4.34"

[target.'cfg(not(target_os = "android"))'.dependencies]
matterweave-audio = { path = "../../crates/matterweave-audio", default-features = false, features = ["backend-mock"] }

# Thread CPU clock for opt-in capture only; already in the locked graph.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "=0.2.191"

# Real AAudio output on device; the deterministic mock elsewhere. Features are
# additive per target, so a host build never links the Android backend.
[target.'cfg(target_os = "android")'.dependencies]
matterweave-audio = { path = "../../crates/matterweave-audio", default-features = false, features = ["backend-android"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
android_logger = "=0.15.1"
