[package]
name = "matterweave-render"
version.workspace = true
edition = "2021"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
matterweave-core = { path = "../matterweave-core" }
ash = "=0.38.0"
ash-window = "=0.13.0"
raw-window-handle = "=0.6.2"
winit = { version = "=0.30.12", features = ["android-native-activity"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
font8x8 = "=0.3.1"
glam = "=0.34.1"

[build-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out"] }
