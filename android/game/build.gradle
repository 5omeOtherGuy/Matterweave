plugins { id 'com.android.application' }

android {
    namespace = 'dev.matterweave.mossbound'
    compileSdk = 35
    buildToolsVersion = '36.0.0'
    ndkVersion = '28.2.13676358'
    // NativeActivity only (hasCode=false): keep AGP 9's built-in Kotlin and its
    // stdlib out of the APK.
    enableKotlin = false
    defaultConfig {
        applicationId = 'dev.matterweave.mossbound'
        minSdk = 28
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0'
        ndk { abiFilters += 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable = true }
        release { minifyEnabled = false }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    sourceSets {
        debug.jniLibs.srcDir layout.buildDirectory.dir('rustJniLibs/debug').get().asFile
        release.jniLibs.srcDir layout.buildDirectory.dir('rustJniLibs/release').get().asFile
    }
}

// The game shares the engine crates with the explorer but builds its own
// application crate and native library, so the two APKs install side by side.
def sdkDirectory = androidComponents.sdkComponents.sdkDirectory
['Debug': 'dev', 'Release': 'release'].each { variant, profile ->
    def rustTask = tasks.register("buildRust${variant}", Exec) {
        workingDir = rootProject.projectDir.parentFile
        doFirst {
            commandLine 'python3', 'tools/build_native.py', '--sdk', sdkDirectory.get().asFile,
                '--profile', profile, '--out', layout.buildDirectory.dir("rustJniLibs/${variant.toLowerCase()}").get().asFile,
                '--crate', 'matterweave-monsters-app', '--lib', 'libmatterweave_monsters_app.so'
        }
    }
    tasks.configureEach { task ->
        if (task.name == "merge${variant}JniLibFolders") { task.dependsOn rustTask }
    }
}
